name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      # Supabase local (supabase start): valores públicos e fixos da CLI, não são segredos.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      TMDB_READ_TOKEN: token-ci
      # TMDB falso dos testes E2E (tests/e2e/tmdb-falso), subido pelo Playwright.
      TMDB_API_URL: http://127.0.0.1:4010/3
      # Pôsteres falsos nos E2E: sem otimizador de imagens (ver next.config.ts).
      IMAGENS_SEM_OTIMIZACAO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Só os serviços que o app usa, para subir mais rápido.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,mailpit,supavisor
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm check:secrets
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
